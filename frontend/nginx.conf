server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — React Router owns client-side routes like
    # /reset-password, so any path nginx doesn't have a file for should
    # still serve index.html rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
